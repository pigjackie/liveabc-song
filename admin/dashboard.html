<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>教師管理後台 · 互動美語 X 如苑</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Noto+Serif+TC:wght@400;600&display=swap" rel="stylesheet">
  <style>
    html, body, div, span, header, nav, main, section, input, button, textarea, select, h1, h2, h3, p, label {
      box-sizing: border-box; margin: 0; padding: 0;
    }
    :root {
      --gold: #C9A84C;
      --gold-light: #E8C97A;
      --gold-dim: #8A6E30;
      --black: #0D0D0D;
      --surface: #161616;
      --surface2: #1F1F1F;
      --border: rgba(201,168,76,0.25);
      --text-main: #F0EAD6;
      --text-muted: #9A9180;
      --radius: 12px;
      --font-serif: 'Playfair Display','Noto Serif TC',serif;
    }
    [data-theme="ivory"] {
      --black:#F6F0E4; --surface:#FFFDF8; --surface2:#F1E6D2; --border:rgba(138,110,48,.28);
      --text-main:#241D14; --text-muted:#756A5A; --gold:#9C7A24; --gold-light:#B99335; --gold-dim:#7B642A;
    }
    [data-theme="studio"] {
      --black:#07121C; --surface:#102033; --surface2:#162B42; --border:rgba(103,177,255,.26);
      --text-main:#EAF4FF; --text-muted:#91A7BD; --gold:#67B1FF; --gold-light:#A6D4FF; --gold-dim:#6D91B6;
    }
    html, body {
      min-height: 100%;
      background: var(--black);
      color: var(--text-main);
      font-family: -apple-system, 'Noto Sans TC', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 1.5rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-title { font-family: var(--font-serif); font-size: 20px; color: var(--gold-light); }
    .header-sub { font-size: 13px; color: var(--text-muted); margin-top: 4px; }
    .logout-btn {
      background: transparent; border: 1px solid var(--border); border-radius: 8px;
      padding: 8px 16px; color: var(--text-muted); font-size: 13px; cursor: pointer;
      transition: 0.2s;
    }
    .logout-btn:hover { border-color: var(--gold); color: var(--gold); }

    .container {
      display: flex;
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem;
      gap: 2rem;
    }

    nav.sidebar {
      width: 200px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .nav-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 12px 16px;
      border-radius: var(--radius);
      text-align: left;
      cursor: pointer;
      font-size: 14px;
      transition: 0.2s;
    }
    .nav-btn:hover { background: var(--surface2); }
    .nav-btn.active { background: var(--gold); color: var(--black); font-weight: 600; border-color: var(--gold); }

    #nav-super-btn {
      display: block;
      border: 1px solid rgba(232,201,122,0.4);
      color: var(--gold-light);
    }

    main.content {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2rem;
      min-height: 500px;
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .section-title {
      font-family: var(--font-serif); font-size: 18px; color: var(--gold);
      margin-bottom: 1.5rem; display: flex; align-items: center; gap: 8px;
    }
    .section-title::before {
      content: ''; display: inline-block; width: 4px; height: 18px; background: var(--gold); border-radius: 2px;
    }

    .sub-panel {
      background: var(--surface2);
      border: 1px solid rgba(201,168,76,0.15);
      border-radius: 8px;
      padding: 1.5rem;
      margin-bottom: 2rem;
    }
    .sub-panel-title {
      font-size: 15px; color: var(--gold-light); margin-bottom: 1.2rem;
      font-weight: 600; display: flex; justify-content: space-between; align-items: center;
    }

    .form-group { margin-bottom: 1.5rem; }
    .form-label { display: block; font-size: 13px; color: var(--gold-dim); margin-bottom: 8px; text-transform: uppercase; }
    .form-input, .form-select, .form-textarea {
      width: 100%; background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; padding: 12px 16px; font-size: 14px; color: var(--text-main);
      outline: none; transition: 0.2s;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--gold); }
    .form-textarea { resize: vertical; min-height: 100px; }

    .btn-submit {
      background: var(--gold); color: var(--black); border: none; border-radius: 8px;
      padding: 12px 24px; font-size: 14px; font-weight: 600; cursor: pointer;
      display: inline-flex; align-items: center; gap: 8px;
    }
    .btn-submit:hover { background: var(--gold-light); }

    .student-selector { margin-bottom: 2rem; padding-bottom: 1.5rem; border-bottom: 1px dashed var(--border); }

    .msg-success {
      display: none; background: rgba(201,168,76,0.1); border: 1px solid var(--gold);
      color: var(--gold-light); padding: 10px 16px; border-radius: 8px; margin-top: 1rem; font-size: 13px;
    }

    .small-hint { font-size: 12px; color: var(--text-muted); margin-top: 6px; }

    .debug-bar {
      display:flex;align-items:center;justify-content:space-between;gap:10px;
      background:rgba(201,168,76,.08);border:1px solid rgba(201,168,76,.18);
      border-radius:10px;padding:10px 12px;margin-bottom:1.25rem;flex-wrap:wrap;
      font-size:12px;color:var(--text-muted);
    }
    .debug-pill {
      display:inline-flex;align-items:center;gap:6px;padding:5px 9px;
      border:1px solid rgba(201,168,76,.22);border-radius:999px;color:var(--gold-light);
      background:rgba(13,13,13,.35);
    }
    .mini-list {
      display:grid;gap:8px;margin-top:1rem;
    }
    .mini-item {
      display:flex;align-items:center;justify-content:space-between;gap:12px;
      border:1px solid rgba(201,168,76,.13);border-radius:8px;
      background:rgba(13,13,13,.28);padding:10px 12px;font-size:13px;
    }
    .mini-meta { color:var(--text-muted);font-size:12px; }
    .theme-picker {display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .theme-picker button {
      background:transparent;border:1px solid var(--border);border-radius:999px;
      color:var(--text-muted);padding:6px 10px;font-size:12px;cursor:pointer;
    }
    .theme-picker button.active {background:var(--gold);color:var(--black);border-color:var(--gold)}

    @media (max-width: 760px) {
      header { padding: 1rem; align-items: flex-start; gap: 12px; }
      .container { flex-direction: column; padding: 1rem; gap: 1rem; }
      nav.sidebar { width: 100%; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
      main.content { padding: 1.25rem; }
    }
  </style>
</head>
<body>

  <header>
    <div>
      <div class="header-title">教師管理後台</div>
      <div class="header-sub">互動美語 × 如苑 · 國一先修小班制專屬</div>
    </div>
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end">
      <div class="theme-picker" aria-label="介面風格">
        <button type="button" data-theme-btn="obsidian" onclick="setTheme('obsidian')">曜石金</button>
        <button type="button" data-theme-btn="ivory" onclick="setTheme('ivory')">白瓷紙</button>
        <button type="button" data-theme-btn="studio" onclick="setTheme('studio')">藍調學院</button>
      </div>
      <button class="logout-btn" onclick="handleAdminLogout()">登出系統</button>
    </div>
  </header>

  <div class="container">
    <nav class="sidebar">
      <button class="nav-btn active" onclick="switchTab('tab-contact', this)">聯絡簿佈達</button>
      <button class="nav-btn" onclick="switchTab('tab-grades', this)">成績與診斷</button>
      <button class="nav-btn" onclick="switchTab('tab-messages', this)">發布訊息與課表</button>
      <button class="nav-btn" id="nav-super-btn" onclick="switchTab('tab-superuser', this)">班級與帳號管理</button>
    </nav>

    <main class="content">

      <div class="debug-bar">
        <span class="debug-pill">目前身分：<b id="admin-role-label">確認中</b></span>
        <span id="admin-debug">系統準備中...</span>
      </div>

      <div class="student-selector" id="global-student-wrapper">
        <label class="form-label">班級</label>
        <select class="form-select" id="global-class-select" onchange="filterStudentsByClass()">
          <option value="">請先選擇班級...</option>
        </select>
        <label class="form-label">當前操作學生 (小班制精準關注)</label>
        <select class="form-select" id="global-student-select">
          <option value="">可選擇單一學生，或留空發布給全班</option>
        </select>
      </div>

      <div id="tab-contact" class="tab-content active">
        <div class="section-title">新增數位聯絡簿</div>
        <div class="form-group">
          <label class="form-label">日期</label>
          <input type="date" class="form-input" id="contact-date">
        </div>
        <div class="form-group">
          <label class="form-label">出缺勤</label>
          <select class="form-select" id="contact-attendance">
            <option value="準時">準時</option>
            <option value="遲到">遲到</option>
            <option value="請假">請假</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">英文進度</label>
          <input type="text" class="form-input" id="contact-en" placeholder="例如：Unit 1 核心單字總複習">
        </div>
        <div class="form-group">
          <label class="form-label">國文進度</label>
          <input type="text" class="form-input" id="contact-zh" placeholder="例如：文言文基本句型修辭">
        </div>
        <div class="form-group">
          <label class="form-label">指派作業</label>
          <textarea class="form-textarea" id="contact-hw" placeholder="請輸入今日作業內容..."></textarea>
        </div>
        <div class="form-group">
          <label class="form-label">課堂表現標籤 (用半形逗號分隔)</label>
          <input type="text" class="form-input" id="contact-tags" placeholder="例如：專注度佳,互動良好">
        </div>
        <button class="btn-submit" onclick="submitContact()">發布聯絡簿</button>
        <div id="msg-contact" class="msg-success">聯絡簿已成功發布！</div>
      </div>

      <div id="tab-grades" class="tab-content">
        <div class="section-title">登錄成績與個別化診斷</div>
        <div class="form-group">
          <label class="form-label">測驗日期</label>
          <input type="date" class="form-input" id="grade-date">
        </div>
        <div class="form-group">
          <label class="form-label">測驗名稱</label>
          <input type="text" class="form-input" id="grade-title" placeholder="例如：第一週課堂單字測驗">
        </div>
        <div class="form-group">
          <label class="form-label">測驗分數</label>
          <input type="number" class="form-input" id="grade-score" min="0" max="100" placeholder="0-100">
        </div>
        <div class="form-group">
          <label class="form-label">全班平均 (用於圖表對比)</label>
          <input type="number" class="form-input" id="grade-avg" min="0" max="100" placeholder="輸入全班平均">
        </div>
        <div class="form-group">
          <label class="form-label">個別化診斷與精進方針</label>
          <textarea class="form-textarea" id="grade-diagnosis" placeholder="針對該名學生的弱點給予具體建議..."></textarea>
        </div>
        <button class="btn-submit" onclick="submitGrade()">登錄成績</button>
        <div id="msg-grade" class="msg-success">成績與診斷已成功儲存！</div>
      </div>

      <div id="tab-messages" class="tab-content">
        <div class="section-title">發布新訊息與班級課表</div>
        <div class="sub-panel">
          <div class="sub-panel-title">發布班級新訊息</div>
          <div class="form-group">
            <label class="form-label">訊息班級</label>
            <select class="form-select" id="message-class-select">
              <option value="">請選擇班級...</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">訊息標題</label>
            <input type="text" class="form-input" id="message-title" placeholder="例如：本週課前提醒">
          </div>
          <div class="form-group">
            <label class="form-label">訊息內容</label>
            <textarea class="form-textarea" id="message-body" placeholder="輸入要發布給該班家長的訊息..."></textarea>
          </div>
          <button class="btn-submit" onclick="publishMessage()">發布新訊息</button>
          <div id="msg-message" class="msg-success">新訊息已發布！</div>
        </div>
        <div class="sub-panel">
          <div class="sub-panel-title">貼上 / 更新班級課表</div>
          <div class="form-group">
            <label class="form-label">課表班級</label>
            <select class="form-select" id="schedule-class-select">
              <option value="">請選擇班級...</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">課表圖片網址（可選）</label>
            <input type="url" class="form-input" id="schedule-image" placeholder="https://.../schedule.jpg">
          </div>
          <div class="form-group">
            <label class="form-label">課表文字</label>
            <textarea class="form-textarea" id="schedule-text" placeholder="也可以直接貼上文字課表，例如：週一 19:00 英文閱讀..."></textarea>
          </div>
          <button class="btn-submit" onclick="saveSchedule()">儲存班級課表</button>
          <div id="msg-schedule" class="msg-success">課表已更新！</div>
        </div>
      </div>

      <div id="tab-superuser" class="tab-content">
        <div class="section-title">班級、學生、老師與管理者管理</div>

        <div class="sub-panel">
          <div class="sub-panel-title">
            <span>1. 配置新班級</span>
            <button class="btn-submit" style="padding:7px 12px;font-size:12px" onclick="loadClasses()">重新整理</button>
          </div>
          <div class="form-group">
            <label class="form-label">班級名稱</label>
            <input type="text" class="form-input" id="super-class-name" placeholder="例如：國一英語先修A班">
          </div>
          <button class="btn-submit" onclick="createClass()">確認新增班級</button>
          <div id="msg-super-class" class="msg-success">班級配置成功！</div>
          <div class="mini-list" id="class-list"></div>
        </div>

        <div class="sub-panel">
          <div class="sub-panel-title">
            <span>2. 註冊新學生帳戶 (VIP 家長專屬憑證)</span>
            <button class="btn-submit" style="padding:7px 12px;font-size:12px" onclick="loadStudents()">重新整理</button>
          </div>
          <div class="form-group">
            <label class="form-label">學生姓名</label>
            <input type="text" class="form-input" id="super-student-name" placeholder="請輸入學生真實姓名">
          </div>
          <div class="form-group">
            <label class="form-label">所屬班級</label>
            <select class="form-select" id="super-student-class">
              <option value="">請選擇班級...</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">家長專屬登入密碼</label>
            <input type="text" class="form-input" id="super-student-pwd" placeholder="設定家長登入初始密碼">
          </div>
          <button class="btn-submit" onclick="createStudent()">確認建立學生帳戶</button>
          <div id="msg-super-student" class="msg-success">學生帳戶與家長憑證建立成功！</div>
          <div class="mini-list" id="student-list"></div>
        </div>

        <div class="sub-panel">
          <div class="sub-panel-title">
            <span>3. 授權老師或管理者帳號</span>
            <button class="btn-submit" style="padding:7px 12px;font-size:12px" onclick="loadStaff()">重新整理</button>
          </div>
          <div class="form-group">
            <label class="form-label">帳號身分</label>
            <select class="form-select" id="super-staff-type">
              <option value="teacher">老師 (授課與成績登錄)</option>
              <option value="admin">管理者 (行政與系統營運)</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">電子郵件 (登入帳號)</label>
            <input type="email" class="form-input" id="super-staff-email" placeholder="staff@email.com">
          </div>
          <div class="form-group">
            <label class="form-label">人員姓名</label>
            <input type="text" class="form-input" id="super-staff-name" placeholder="請輸入人員姓名或稱呼">
          </div>
          <div class="form-group">
            <label class="form-label">登入密碼</label>
            <input type="password" class="form-input" id="super-staff-pwd" placeholder="設定教職員登入初始密碼">
          </div>
          <button class="btn-submit" onclick="createStaff()">確認授權教職員</button>
          <div id="msg-super-staff" class="msg-success">教職員帳號建立成功！</div>
          <div class="mini-list" id="staff-list"></div>
        </div>

      </div>

    </main>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import {
      collection,
      query,
      where,
      getDocs,
      getDoc,
      doc,
      addDoc,
      setDoc,
      serverTimestamp,
      Timestamp
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
    import { db, auth } from '../js/firebase-config.js';

    let allStudents = [];

    const adminUid = sessionStorage.getItem('vip_uid');
    const role = sessionStorage.getItem('vip_role');
    const isSuperAdmin = sessionStorage.getItem('vip_super') === 'true';

    if (!adminUid || (role !== 'admin' && role !== 'teacher')) {
      window.location.href = '../index.html';
    }

    document.getElementById('admin-role-label').textContent = isSuperAdmin ? '最高管理者' : (role === 'admin' ? '管理者' : '老師');

    document.getElementById('contact-date').valueAsDate = new Date();
    document.getElementById('grade-date').valueAsDate = new Date();

    const firebaseConfig = {
      apiKey: "AIzaSyCWcNX_urPo8HOV42pL_ngHs7a9T60tGWY",
      authDomain: "liveabc-song.firebaseapp.com",
      projectId: "liveabc-song",
      storageBucket: "liveabc-song.firebasestorage.app",
      messagingSenderId: "545222080412",
      appId: "1:545222080412:web:1c3a34e4b88053ebb97a59"
    };

    window.handleAdminLogout = async function() {
      await auth.signOut();
      sessionStorage.clear();
      window.location.href = '../index.html';
    };

    window.switchTab = function(tabId, btnEl) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      btnEl.classList.add('active');

      if (tabId === 'tab-superuser') {
        document.getElementById('global-student-wrapper').style.display = 'none';
      } else {
        document.getElementById('global-student-wrapper').style.display = 'block';
      }
    };

    function showSuccessMsg(id) {
      const el = document.getElementById(id);
      el.style.display = 'block';
      setTimeout(() => { el.style.display = 'none'; }, 3000);
    }

    function setDebug(message) {
      const el = document.getElementById('admin-debug');
      if (el) el.textContent = message;
    }

    function escapeHtml(value) {
      return String(value || '').replace(/[&<>"']/g, ch => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
      }[ch]));
    }

    window.setTheme = function(theme) {
      document.documentElement.dataset.theme = theme;
      localStorage.setItem('vip_theme', theme);
      document.querySelectorAll('[data-theme-btn]').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.themeBtn === theme);
      });
    };
    setTheme(localStorage.getItem('vip_theme') || 'obsidian');

    window.filterStudentsByClass = function() {
      const className = document.getElementById('global-class-select').value;
      const select = document.getElementById('global-student-select');
      select.innerHTML = '<option value="">全班發布 / 不指定單一學生</option>';
      allStudents
        .filter(stu => !className || stu.className === className)
        .forEach(stu => {
          const option = document.createElement('option');
          option.value = stu.id;
          option.textContent = stu.name + ' (' + (stu.className || '未指定班級') + ')';
          select.appendChild(option);
        });
    };

    async function hashPassword(pwd) {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(pwd));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    window.loadStudents = async function() {
      try {
        const q = query(collection(db, 'users'), where('role', '==', 'parent'));
        const snap = await getDocs(q);
        const select = document.getElementById('global-student-select');
        const list = document.getElementById('student-list');
        select.innerHTML = '<option value="">全班發布 / 不指定單一學生</option>';
        allStudents = [];
        const rows = [];
        snap.forEach(docSnap => {
          const data = docSnap.data();
          allStudents.push({ id: docSnap.id, name: data.name || '', className: data.className || '' });
          const option = document.createElement('option');
          option.value = docSnap.id;
          option.textContent = data.name + ' (' + (data.className || '未指定班級') + ')';
          select.appendChild(option);
          rows.push(`<div class="mini-item"><span>${escapeHtml(data.name)}</span><span class="mini-meta">${escapeHtml(data.className || '未指定班級')}</span></div>`);
        });
        filterStudentsByClass();
        if (list) list.innerHTML = rows.length ? rows.join('') : '<div class="mini-item"><span class="mini-meta">目前尚未建立學生</span></div>';
        setDebug(`已載入 ${snap.size} 位學生`);
      } catch (err) {
        console.error("載入學生清單失敗:", err);
        setDebug('載入學生清單失敗，請檢查 Firebase 權限');
      }
    };

    window.loadClasses = async function() {
      try {
        const snap = await getDocs(collection(db, 'classes'));
        const superStudentClass = document.getElementById('super-student-class');
        const globalClass = document.getElementById('global-class-select');
        const messageClass = document.getElementById('message-class-select');
        const scheduleClass = document.getElementById('schedule-class-select');
        const list = document.getElementById('class-list');
        superStudentClass.innerHTML = '<option value="">請選擇班級...</option>';
        globalClass.innerHTML = '<option value="">請選擇班級...</option>';
        messageClass.innerHTML = '<option value="">請選擇班級...</option>';
        scheduleClass.innerHTML = '<option value="">請選擇班級...</option>';
        const rows = [];
        snap.forEach(docSnap => {
          const data = docSnap.data();
          [superStudentClass, globalClass, messageClass, scheduleClass].forEach(sel => {
            const option = document.createElement('option');
            option.value = data.className;
            option.textContent = data.className;
            sel.appendChild(option);
          });
          rows.push(`<div class="mini-item"><span>${escapeHtml(data.className)}</span><span class="mini-meta">班級</span></div>`);
        });
        if (list) list.innerHTML = rows.length ? rows.join('') : '<div class="mini-item"><span class="mini-meta">目前尚未建立班級</span></div>';
        setDebug(`已載入 ${snap.size} 個班級`);
      } catch (err) {
        console.error("載入班級清單失敗:", err);
        setDebug('載入班級清單失敗，請檢查 Firebase 權限');
      }
    };

    window.loadStaff = async function() {
      try {
        const snap = await getDocs(collection(db, 'users'));
        const rows = [];
        snap.forEach(docSnap => {
          const data = docSnap.data();
          if (!['admin','teacher'].includes(data.role)) return;
          const roleLabel = data.role === 'admin' ? '管理者' : '老師';
          rows.push(`<div class="mini-item"><span>${escapeHtml(data.name || data.email)}</span><span class="mini-meta">${roleLabel} · ${escapeHtml(data.email || '')}</span></div>`);
        });
        const list = document.getElementById('staff-list');
        if (list) list.innerHTML = rows.length ? rows.join('') : '<div class="mini-item"><span class="mini-meta">目前尚未建立老師或管理者</span></div>';
        setDebug(`已載入 ${rows.length} 位教職員`);
      } catch (err) {
        console.error("載入教職員清單失敗:", err);
        setDebug('載入教職員清單失敗，請檢查 Firebase 權限');
      }
    };

    window.submitContact = async function() {
      const className = document.getElementById('global-class-select').value;
      const studentId = document.getElementById('global-student-select').value;
      if (!className) return alert('請先選擇班級');

      const data = {
        studentId: studentId,
        className: className,
        date: document.getElementById('contact-date').value,
        attendance: document.getElementById('contact-attendance').value,
        progressEnglish: document.getElementById('contact-en').value.trim(),
        progressChinese: document.getElementById('contact-zh').value.trim(),
        homework: document.getElementById('contact-hw').value.trim(),
        tags: document.getElementById('contact-tags').value.split(',').map(t => t.trim()).filter(t => t),
        createdAt: serverTimestamp()
      };

      try {
        await addDoc(collection(db, 'contact_books'), data);
        showSuccessMsg('msg-contact');
        document.getElementById('contact-en').value = '';
        document.getElementById('contact-zh').value = '';
        document.getElementById('contact-hw').value = '';
        document.getElementById('contact-tags').value = '';
      } catch (err) {
        console.error("聯絡簿發布失敗:", err);
      }
    };

    window.publishMessage = async function() {
      const className = document.getElementById('message-class-select').value;
      const title = document.getElementById('message-title').value.trim();
      const body = document.getElementById('message-body').value.trim();
      if (!className || !title || !body) return alert('請選擇班級並填寫標題與內容');
      try {
        await addDoc(collection(db, 'class_messages'), {
          className, title, body,
          createdBy: sessionStorage.getItem('vip_name') || '',
          createdAt: serverTimestamp()
        });
        showSuccessMsg('msg-message');
        document.getElementById('message-title').value = '';
        document.getElementById('message-body').value = '';
        setDebug(`已發布 ${className} 新訊息`);
      } catch (err) {
        console.error('發布訊息失敗:', err);
        alert('發布訊息失敗，請檢查 Firebase 權限或網路連線');
      }
    };

    window.saveSchedule = async function() {
      const className = document.getElementById('schedule-class-select').value;
      const imageUrl = document.getElementById('schedule-image').value.trim();
      const scheduleText = document.getElementById('schedule-text').value.trim();
      if (!className) return alert('請先選擇班級');
      if (!imageUrl && !scheduleText) return alert('請貼上課表文字或圖片網址');
      try {
        await setDoc(doc(db, 'class_schedules', className), {
          className, imageUrl, scheduleText,
          updatedBy: sessionStorage.getItem('vip_name') || '',
          updatedAt: serverTimestamp()
        });
        showSuccessMsg('msg-schedule');
        setDebug(`已更新 ${className} 課表`);
      } catch (err) {
        console.error('儲存課表失敗:', err);
        alert('儲存課表失敗，請檢查 Firebase 權限或網路連線');
      }
    };

    window.submitGrade = async function() {
      const studentId = document.getElementById('global-student-select').value;
      if (!studentId) return alert('請先選擇學生');

      const dateStr = document.getElementById('grade-date').value;
      const data = {
        studentId: studentId,
        title: document.getElementById('grade-title').value.trim(),
        score: Number(document.getElementById('grade-score').value),
        averageScore: Number(document.getElementById('grade-avg').value),
        diagnosis: document.getElementById('grade-diagnosis').value.trim(),
        examDate: Timestamp.fromDate(new Date(dateStr))
      };

      if (!data.title || isNaN(data.score)) return alert('請填寫完整的測驗名稱與分數');

      try {
        await addDoc(collection(db, 'grades'), data);
        showSuccessMsg('msg-grade');
        document.getElementById('grade-title').value = '';
        document.getElementById('grade-score').value = '';
        document.getElementById('grade-avg').value = '';
        document.getElementById('grade-diagnosis').value = '';
      } catch (err) {
        console.error("成績登錄失敗:", err);
      }
    };

    window.createClass = async function() {
      const className = document.getElementById('super-class-name').value.trim();
      if (!className) return alert('請輸入班級名稱');

      try {
        const existing = await getDocs(query(collection(db, 'classes'), where('className', '==', className)));
        if (!existing.empty) return alert('此班級名稱已存在');
        await addDoc(collection(db, 'classes'), {
          className: className,
          createdAt: serverTimestamp()
        });
        showSuccessMsg('msg-super-class');
        document.getElementById('super-class-name').value = '';
        await loadClasses();
      } catch (err) {
        console.error("建立班級失敗:", err);
        alert('建立班級失敗，請檢查 Firebase 權限或網路連線');
      }
    };

    window.createStudent = async function() {
      const name = document.getElementById('super-student-name').value.trim();
      const className = document.getElementById('super-student-class').value;
      const pwd = document.getElementById('super-student-pwd').value;

      if (!name || !className || !pwd) return alert('請填寫完整學生帳戶資料');

      try {
        const existing = await getDocs(query(collection(db, 'users'), where('name', '==', name), where('role', '==', 'parent')));
        if (!existing.empty) return alert('此學生姓名已存在，請確認是否重複建立');
        const hashed = await hashPassword(pwd);
        await addDoc(collection(db, 'users'), {
          name: name,
          className: className,
          passwordHash: hashed,
          role: 'parent',
          createdAt: serverTimestamp()
        });
        showSuccessMsg('msg-super-student');
        document.getElementById('super-student-name').value = '';
        document.getElementById('super-student-class').value = '';
        document.getElementById('super-student-pwd').value = '';
        await loadStudents();
      } catch (err) {
        console.error("建立學生失敗:", err);
        alert('建立學生失敗，請檢查 Firebase 權限或網路連線');
      }
    };

    window.createStaff = async function() {
      const type = document.getElementById('super-staff-type').value;
      const email = document.getElementById('super-staff-email').value.trim();
      const name = document.getElementById('super-staff-name').value.trim();
      const pwd = document.getElementById('super-staff-pwd').value;

      if (!email || !name || !pwd) return alert('請填寫完整教職員權限資料');

      try {
        const secondaryApp = initializeApp(firebaseConfig, "SecondaryAuthInstance-" + Date.now());
        const secondaryAuth = getAuth(secondaryApp);

        const cred = await createUserWithEmailAndPassword(secondaryAuth, email, pwd);
        const newUid = cred.user.uid;

        await setDoc(doc(db, 'users', newUid), {
          email: email,
          name: name,
          role: type,
          jobTitle: type === 'admin' ? '管理者' : '老師',
          isSuperAdmin: false,
          createdAt: serverTimestamp()
        });

        await signOut(secondaryAuth);
        await loadStaff();

        showSuccessMsg('msg-super-staff');
        document.getElementById('super-staff-email').value = '';
        document.getElementById('super-staff-name').value = '';
        document.getElementById('super-staff-pwd').value = '';
      } catch (err) {
        console.error("建立教職員失敗:", err);
        alert("授權失敗: " + err.message);
      }
    };

    loadStudents();
    loadClasses();
    loadStaff();
  </script>
</body>
</html>
