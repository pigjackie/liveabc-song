<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>互動美語 X 如苑 · VIP 家長平台</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Noto+Serif+TC:wght@400;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold:        #C9A84C;
      --gold-light:  #E8C97A;
      --gold-dim:    #8A6E30;
      --black:       #0D0D0D;
      --surface:     #161616;
      --surface2:    #1F1F1F;
      --border:      rgba(201,168,76,0.25);
      --border-hover:rgba(201,168,76,0.6);
      --text-main:   #F0EAD6;
      --text-muted:  #9A9180;
      --radius:      12px;
      --font-serif:  'Playfair Display', 'Noto Serif TC', serif;
    }

    html, body {
      min-height: 100%;
      background: var(--black);
      color: var(--text-main);
      font-family: -apple-system, 'Noto Sans TC', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100svh;
      padding: 2rem 1.25rem;
      background-image:
        radial-gradient(ellipse 60% 40% at 50% 0%, rgba(201,168,76,0.07) 0%, transparent 70%);
    }

    .login-wrap {
      width: 100%;
      max-width: 400px;
    }

    .brand {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    .brand-badge {
      display: inline-block;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 4px 16px;
      font-size: 11px;
      letter-spacing: 0.12em;
      color: var(--gold);
      text-transform: uppercase;
      margin-bottom: 1rem;
    }

    .brand-title {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 5vw, 2rem);
      font-weight: 600;
      color: var(--gold-light);
      line-height: 1.3;
      margin-bottom: 0.4rem;
    }

    .brand-sub {
      font-size: 13px;
      color: var(--text-muted);
      letter-spacing: 0.05em;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 2rem;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }
    .divider span {
      font-size: 11px;
      color: var(--gold-dim);
      letter-spacing: 0.1em;
      white-space: nowrap;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2rem 1.75rem;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-label {
      display: block;
      font-size: 12px;
      color: var(--gold-dim);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .form-input {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 13px 16px;
      font-size: 15px;
      color: var(--text-main);
      outline: none;
      transition: border-color 0.2s;
      -webkit-appearance: none;
    }
    .form-input::placeholder { color: var(--text-muted); }
    .form-input:focus { border-color: var(--gold); }

    .input-hint {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 5px;
    }

    .btn-login {
      width: 100%;
      background: var(--gold);
      color: var(--black);
      border: none;
      border-radius: 8px;
      padding: 14px;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.05em;
      cursor: pointer;
      margin-top: 0.5rem;
      transition: background 0.2s, transform 0.1s;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-login:hover  { background: var(--gold-light); }
    .btn-login:active { transform: scale(0.98); }
    .btn-login:disabled {
      background: var(--gold-dim);
      cursor: not-allowed;
      transform: none;
    }

    .error-msg {
      display: none;
      background: rgba(220,50,50,0.12);
      border: 1px solid rgba(220,50,50,0.3);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      color: #f87171;
      margin-top: 1rem;
      text-align: center;
    }
    .error-msg.show { display: block; }

    .loading-ring {
      display: none;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(0,0,0,0.3);
      border-top-color: var(--black);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto;
    }
    .loading-ring.show { display: block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .footer-note {
      text-align: center;
      margin-top: 2rem;
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.7;
    }

    .gold-line {
      width: 40px;
      height: 2px;
      background: var(--gold);
      margin: 0 auto 1.5rem;
      border-radius: 2px;
      opacity: 0.5;
    }
  </style>
</head>
<body>

<div class="login-wrap">

  <div class="brand">
    <div class="brand-badge">VIP Members Only</div>
    <h1 class="brand-title">互動美語 × 如苑</h1>
    <p class="brand-sub">國一英語先修班 · 家長專屬服務平台</p>
  </div>

  <div class="gold-line"></div>

  <div class="divider">
    <span>專屬登入</span>
  </div>

  <div class="card">
    <div class="form-group">
      <label class="form-label" for="alias-input">帳號代碼</label>
      <input
        class="form-input"
        id="alias-input"
        type="text"
        placeholder="請輸入您的專屬帳號"
        autocomplete="username"
        autocapitalize="none"
        spellcheck="false"
      >
      <p class="input-hint">由老師提供的專屬代碼，如 A01、admin</p>
    </div>

    <div class="form-group">
      <label class="form-label" for="password-input">密碼</label>
      <input
        class="form-input"
        id="password-input"
        type="password"
        placeholder="請輸入密碼"
        autocomplete="current-password"
      >
    </div>

    <button class="btn-login" id="login-btn" onclick="handleLogin()">
      <span id="btn-text">登入</span>
      <div class="loading-ring" id="loading-ring"></div>
    </button>

    <div class="error-msg" id="error-msg"></div>
  </div>

  <p class="footer-note">
    帳號由老師統一建立管理<br>
    如需協助請聯繫班級老師
  </p>

</div>

<script type="module">
  import { auth, db } from './js/firebase-config.js';
  import { signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { collection, query, where, getDocs, doc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  window.handleLogin = async function() {
    const alias    = document.getElementById('alias-input').value.trim();
    const password = document.getElementById('password-input').value;
    const btn      = document.getElementById('login-btn');
    const btnText  = document.getElementById('btn-text');
    const ring     = document.getElementById('loading-ring');
    const errMsg   = document.getElementById('error-msg');

    errMsg.classList.remove('show');

    if (!alias || !password) {
      showError('請輸入帳號代碼與密碼');
      return;
    }

    btn.disabled = true;
    btnText.style.display = 'none';
    ring.classList.add('show');

    try {
      const q    = query(collection(db, 'users'), where('alias', '==', alias));
      const snap = await getDocs(q);

      if (snap.empty) {
        showError('找不到此帳號，請確認代碼是否正確');
        return;
      }

      const userDoc  = snap.docs[0];
      const userData = userDoc.data();
      const email    = userData.email || alias + '@liveabc-song.vip';

      await signInWithEmailAndPassword(auth, email, password);

      await updateDoc(doc(db, 'users', userDoc.id), {
        lastLogin: serverTimestamp()
      });

      if (userData.role === 'admin') {
        window.location.href = './admin/dashboard.html';
      } else {
        window.location.href = './parent/dashboard.html';
      }

    } catch (err) {
      console.error(err);
      if (err.code === 'auth/wrong-password' || err.code === 'auth/invalid-credential') {
        showError('密碼錯誤，請重新輸入');
      } else if (err.code === 'auth/too-many-requests') {
        showError('嘗試次數過多，請稍後再試');
      } else {
        showError('登入失敗，請稍後再試');
      }
    } finally {
      btn.disabled = false;
      btnText.style.display = 'block';
      ring.classList.remove('show');
    }
  };

  function showError(msg) {
    const el = document.getElementById('error-msg');
    el.textContent = msg;
    el.classList.add('show');
  }

  document.getElementById('password-input').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') window.handleLogin();
  });
  document.getElementById('alias-input').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') document.getElementById('password-input').focus();
  });
</script>

</body>
</html>
