<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>互動美語 × 如苑 · 登入</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Noto+Serif+TC:wght@300;400;600;700&family=DM+Sans:wght@300;400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Space+Grotesk:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

    /* ══ THEME TOKENS ══ */
    [data-theme="obsidian"]{
      --bg:#080808;--bg2:#0F0F0F;--surface:#141414;--surface2:#1C1C1C;--surface3:#242424;
      --border:rgba(201,168,76,.2);--border-hi:rgba(201,168,76,.55);
      --accent:#C9A84C;--accent-l:#E8C97A;--accent-d:#7A5F28;--glow:rgba(201,168,76,.12);
      --text:#F0EAD6;--text-s:#A89E88;--text-m:#5A5248;--danger:#C0392B;
      --radius:12px;--font-d:'Playfair Display','Noto Serif TC',serif;--font-b:'DM Sans','Noto Serif TC',sans-serif;
    }
    [data-theme="ivory"]{
      --bg:#F2EDE5;--bg2:#EAE4DA;--surface:#FAFAF7;--surface2:#EDE8DF;--surface3:#E2DDD5;
      --border:rgba(100,75,45,.15);--border-hi:rgba(100,75,45,.42);
      --accent:#7B5E38;--accent-l:#9E7A4D;--accent-d:#B8996A;--glow:rgba(123,94,56,.08);
      --text:#26180E;--text-s:#5A4835;--text-m:#9A8870;--danger:#A83030;
      --radius:12px;--font-d:'Cormorant Garamond','Noto Serif TC',serif;--font-b:'DM Sans','Noto Serif TC',sans-serif;
    }
    [data-theme="neon"]{
      --bg:#0C1016;--bg2:#141920;--surface:#1A2030;--surface2:#202838;--surface3:#2A3448;
      --border:rgba(56,189,248,.16);--border-hi:rgba(56,189,248,.5);
      --accent:#38BDF8;--accent-l:#7DD3FC;--accent-d:#0EA5E9;--glow:rgba(56,189,248,.1);
      --text:#D0DCE8;--text-s:#8298B0;--text-m:#445060;--danger:#F05050;
      --radius:8px;--font-d:'Space Grotesk',sans-serif;--font-b:'Space Grotesk',sans-serif;
    }

    html,body{min-height:100vh;background:var(--bg);color:var(--text);font-family:var(--font-b);-webkit-font-smoothing:antialiased;transition:background .35s,color .35s}

    /* BG GLOW */
    body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse 60% 50% at 50% -5%,var(--glow),transparent 70%)}

    .page{position:relative;z-index:1;min-height:100vh;display:grid;grid-template-columns:1fr 460px}

    /* ── LEFT BRAND ── */
    .brand{display:flex;flex-direction:column;justify-content:center;padding:4rem 3.5rem;position:relative;overflow:hidden}
    .brand::after{content:'如苑';position:absolute;right:-1rem;bottom:-3rem;font-family:var(--font-d);font-size:clamp(10rem,16vw,18rem);font-weight:700;color:var(--accent);opacity:.04;line-height:1;pointer-events:none;user-select:none}
    .b-pill{display:inline-flex;align-items:center;gap:8px;background:var(--glow);border:1px solid var(--border);border-radius:99px;padding:5px 16px;font-size:11.5px;color:var(--accent-l);letter-spacing:.08em;text-transform:uppercase;font-weight:500;width:fit-content;margin-bottom:2.5rem}
    .b-pill::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--accent);animation:pulse 2s infinite}
    @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.85)}}
    .b-mark{width:68px;height:68px;border-radius:16px;background:linear-gradient(135deg,var(--accent-d),var(--accent));display:flex;align-items:center;justify-content:center;font-family:var(--font-d);font-size:30px;font-weight:700;color:#080808;margin-bottom:2rem;box-shadow:0 8px 28px var(--glow)}
    .b-h1{font-family:var(--font-d);font-size:clamp(2rem,3.2vw,3rem);line-height:1.15;font-weight:600;margin-bottom:1.1rem}
    .b-h1 em{font-style:italic;color:var(--accent-l)}
    .b-desc{font-size:15px;color:var(--text-s);line-height:1.8;max-width:400px;margin-bottom:2.75rem}
    .b-feats{display:flex;flex-direction:column;gap:12px}
    .b-feat{display:flex;align-items:center;gap:12px;font-size:14px;color:var(--text-s)}
    .b-feat-ico{width:32px;height:32px;border-radius:8px;background:var(--surface2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}

    /* ── RIGHT LOGIN ── */
    .login{background:var(--surface);border-left:1px solid var(--border);display:flex;flex-direction:column;justify-content:center;padding:2.75rem 2.75rem;position:relative}

    /* Theme row */
    .theme-row{position:absolute;top:1.4rem;right:1.6rem;display:flex;gap:7px;align-items:center}
    .td{width:21px;height:21px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:transform .2s,border-color .2s}
    .td:hover{transform:scale(1.18)}
    .td.active{border-color:var(--accent)}
    .td[data-t="obsidian"]{background:radial-gradient(circle at 35% 35%,#E8C97A,#4A3010)}
    .td[data-t="ivory"]{background:radial-gradient(circle at 35% 35%,#F5F0E8,#7B5E38)}
    .td[data-t="neon"]{background:radial-gradient(circle at 35% 35%,#38BDF8,#0C1016)}

    /* Role tabs */
    .role-tabs{display:flex;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:4px;margin-bottom:2.25rem;gap:3px}
    .rtab{flex:1;padding:10px 8px;border-radius:7px;border:none;background:transparent;cursor:pointer;font-family:var(--font-b);font-size:13px;font-weight:500;color:var(--text-m);transition:.2s;display:flex;align-items:center;justify-content:center;gap:6px}
    .rtab:hover{color:var(--text-s)}
    .rtab.active{background:var(--accent);color:#080808;font-weight:700;box-shadow:0 2px 8px var(--glow)}

    /* Form */
    .l-title{font-family:var(--font-d);font-size:23px;font-weight:600;color:var(--text);margin-bottom:5px}
    .l-sub{font-size:13px;color:var(--text-m);margin-bottom:1.75rem}
    .fg{margin-bottom:1.1rem}
    .fl{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--accent-d);font-weight:600;margin-bottom:7px}
    .fi{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:9px;padding:13px 15px;font-size:14.5px;color:var(--text);font-family:var(--font-b);outline:none;transition:border-color .2s,box-shadow .2s;-webkit-appearance:none}
    .fi:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--glow)}
    .fi::placeholder{color:var(--text-m)}
    .fi-hint{font-size:11px;color:var(--text-m);margin-top:5px}
    #f-name{display:none}
    .btn-login{width:100%;background:var(--accent);color:#080808;border:none;border-radius:9px;padding:14px;font-size:15px;font-weight:700;font-family:var(--font-b);cursor:pointer;transition:.2s;margin-top:.4rem;display:flex;align-items:center;justify-content:center;gap:8px}
    .btn-login:hover{background:var(--accent-l);transform:translateY(-1px);box-shadow:0 6px 18px var(--glow)}
    .btn-login:active{transform:none;box-shadow:none}
    .btn-login:disabled{opacity:.55;cursor:not-allowed;transform:none}
    .errmsg{display:none;background:rgba(192,57,43,.1);border:1px solid rgba(192,57,43,.3);color:#E07060;border-radius:8px;padding:10px 14px;font-size:13px;margin-top:.9rem;animation:shake .35s ease}
    @keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
    .divider-row{display:flex;align-items:center;gap:10px;margin:1.4rem 0;color:var(--text-m);font-size:11.5px}
    .divider-row::before,.divider-row::after{content:'';flex:1;height:1px;background:var(--border)}
    .l-foot{text-align:center;font-size:11.5px;color:var(--text-m);margin-top:1.75rem;line-height:1.75}
    .l-foot a{color:var(--accent-d);text-decoration:none}
    .l-foot a:hover{color:var(--accent)}
    .spin{display:none;width:16px;height:16px;border:2px solid rgba(0,0,0,.2);border-top-color:#000;border-radius:50%;animation:rot .6s linear infinite}
    @keyframes rot{to{transform:rotate(360deg)}}

    @media(max-width:900px){
      .page{grid-template-columns:1fr;grid-template-rows:auto 1fr}
      .brand{padding:2.5rem 2rem 2rem;border-bottom:1px solid var(--border)}
      .b-h1{font-size:1.9rem}.b-desc,.b-feats{display:none}
      .login{border-left:none;padding:2.25rem 1.75rem}
    }
    @media(max-width:480px){.brand{padding:1.75rem 1.25rem 1.5rem}.login{padding:2rem 1.25rem 2.5rem}}
  </style>
</head>
<body data-theme="obsidian">
<div class="page">

  <!-- BRAND -->
  <div class="brand">
    <div class="b-pill">小班制精英課程</div>
    <div class="b-mark">如</div>
    <h1 class="b-h1">互動美語<br><em>× 如苑</em></h1>
    <p class="b-desc">國一先修小班制專屬平台。即時聯絡簿、成績診斷、課表查詢與家長溝通，一站直達。</p>
    <div class="b-feats">
      <div class="b-feat"><div class="b-feat-ico">📋</div>每日數位聯絡簿，即時同步</div>
      <div class="b-feat"><div class="b-feat-ico">📊</div>個人成績趨勢與精準診斷</div>
      <div class="b-feat"><div class="b-feat-ico">🗓</div>課表一目瞭然，不錯過任何課程</div>
      <div class="b-feat"><div class="b-feat-ico">📣</div>最新消息即時推送，永不落後</div>
    </div>
  </div>

  <!-- LOGIN -->
  <div class="login">
    <div class="theme-row">
      <div class="td active" data-t="obsidian" title="曜石金" onclick="setTheme('obsidian',this)"></div>
      <div class="td" data-t="ivory" title="白瓷紙" onclick="setTheme('ivory',this)"></div>
      <div class="td" data-t="neon" title="藍調科技" onclick="setTheme('neon',this)"></div>
    </div>

    <div class="role-tabs">
      <button class="rtab active" id="rt-parent" onclick="switchRole('parent')">👨‍👩‍👦 學生 / 家長</button>
      <button class="rtab" id="rt-staff" onclick="switchRole('staff')">🎓 教師 / 管理者</button>
    </div>

    <div class="l-title" id="l-title">家長專屬登入</div>
    <div class="l-sub" id="l-sub">請輸入學生姓名與家長密碼</div>

    <div class="fg" id="f-name">
      <label class="fl">學生姓名</label>
      <input class="fi" id="inp-name" type="text" placeholder="請輸入孩子的姓名" autocomplete="off">
    </div>
    <div class="fg" id="f-email">
      <label class="fl" id="lbl-email">電子郵件 / 管理者名稱</label>
      <input class="fi" id="inp-email" type="text" placeholder="teacher@email.com 或 宋維" autocomplete="username">
    </div>
    <div class="fg">
      <label class="fl">密碼</label>
      <input class="fi" id="inp-pwd" type="password" placeholder="••••••••" autocomplete="current-password">
      <div class="fi-hint" id="pwd-hint">密碼由老師提供，建議登入後自行更改</div>
    </div>

    <button class="btn-login" id="btn-login" onclick="handleLogin()">
      <span id="btn-txt">登入系統</span>
      <span class="spin" id="btn-spin"></span>
    </button>
    <div class="errmsg" id="errmsg"></div>

    <div class="divider-row">如苑教育</div>
    <div class="l-foot">
      互動美語 × 如苑 · 國一先修小班制<br>
      帳號由老師統一建立 · 如需協助請聯繫班級老師
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, signInAnonymously }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore, collection, query, where, getDocs, getDoc, doc, updateDoc, serverTimestamp }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const CFG = {
    apiKey:"AIzaSyCWcNX_urPo8HOV42pL_ngHs7a9T60tGWY",
    authDomain:"liveabc-song.firebaseapp.com",
    projectId:"liveabc-song",
    storageBucket:"liveabc-song.firebasestorage.app",
    messagingSenderId:"545222080412",
    appId:"1:545222080412:web:1c3a34e4b88053ebb97a59"
  };
  const app  = getApps().length ? getApps()[0] : initializeApp(CFG);
  const auth = getAuth(app);
  const db   = getFirestore(app);

  let role = 'parent';

  window.switchRole = function(r) {
    role = r;
    const isStaff = r === 'staff';
    document.getElementById('rt-parent').classList.toggle('active', !isStaff);
    document.getElementById('rt-staff').classList.toggle('active', isStaff);
    document.getElementById('f-name').style.display   = isStaff ? 'none' : 'block';
    document.getElementById('f-email').style.display  = isStaff ? 'block' : 'none';
    document.getElementById('l-title').textContent    = isStaff ? '教師 / 管理者登入' : '家長專屬登入';
    document.getElementById('l-sub').textContent      = isStaff ? '請輸入您的帳號與密碼' : '請輸入學生姓名與家長密碼';
    document.getElementById('pwd-hint').style.display = isStaff ? 'none' : 'block';
    document.getElementById('errmsg').style.display   = 'none';
  };

  function setLoad(on) {
    document.getElementById('btn-login').disabled      = on;
    document.getElementById('btn-spin').style.display  = on ? 'inline-block' : 'none';
    document.getElementById('btn-txt').style.display   = on ? 'none' : 'inline';
  }
  function showErr(msg) {
    const el = document.getElementById('errmsg');
    el.textContent = msg; el.style.display = 'block';
    el.style.animation = 'none';
    requestAnimationFrame(() => { el.style.animation = 'shake .35s ease'; });
  }
  async function hashPwd(p) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(p));
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }

  window.handleLogin = async function() {
    setLoad(true);
    document.getElementById('errmsg').style.display = 'none';
    try {
      if (role === 'staff') {
        const email = document.getElementById('inp-email').value.trim();
        const pwd   = document.getElementById('inp-pwd').value;
        if (!email || !pwd) { showErr('請填寫電子郵件與密碼'); setLoad(false); return; }

        /* Super admin shortcut (hardcoded — keep or remove per preference) */
        if (email === '宋維' && pwd === '701544') {
          await signInAnonymously(auth);
          sessionStorage.setItem('vip_uid','super-songwei');
          sessionStorage.setItem('vip_name','宋維');
          sessionStorage.setItem('vip_role','admin');
          sessionStorage.setItem('vip_super','true');
          window.location.href = './admin_dashboard.html'; return;
        }

        const cred = await signInWithEmailAndPassword(auth, email, pwd);
        const snap = await getDoc(doc(db,'users', cred.user.uid));
        const data = snap.exists() ? snap.data() : null;
        if (!data || !['admin','teacher'].includes(data.role)) {
          showErr('此帳號沒有教師或管理者權限'); setLoad(false); return;
        }
        await updateDoc(doc(db,'users',cred.user.uid), { lastLogin: serverTimestamp() });
        sessionStorage.setItem('vip_uid',  cred.user.uid);
        sessionStorage.setItem('vip_name', data.name || email);
        sessionStorage.setItem('vip_role', data.role);
        sessionStorage.setItem('vip_super', data.isSuperAdmin ? 'true' : 'false');
        window.location.href = './admin_dashboard.html';

      } else {
        const name = document.getElementById('inp-name').value.trim();
        const pwd  = document.getElementById('inp-pwd').value;
        if (!name || !pwd) { showErr('請填寫學生姓名與密碼'); setLoad(false); return; }

        const hashed = await hashPwd(pwd);
        const q = query(collection(db,'users'),
          where('name','==',name), where('role','==','parent'), where('passwordHash','==',hashed));
        const snap = await getDocs(q);
        if (snap.empty) { showErr('姓名或密碼錯誤，請重新確認'); setLoad(false); return; }

        const d = snap.docs[0];
        await signInAnonymously(auth);
        await updateDoc(doc(db,'users',d.id), { lastLogin: serverTimestamp() });
        sessionStorage.setItem('vip_uid',   d.id);
        sessionStorage.setItem('vip_name',  d.data().name);
        sessionStorage.setItem('vip_class', d.data().className || '');
        sessionStorage.setItem('vip_role',  'parent');
        window.location.href = './parent_dashboard.html';
      }
    } catch(e) {
      console.error(e);
      const map = {
        'auth/user-not-found':'找不到此帳號','auth/wrong-password':'密碼錯誤',
        'auth/invalid-credential':'帳號或密碼錯誤','auth/too-many-requests':'嘗試次數過多，請稍後再試',
        'auth/invalid-email':'Email 格式不正確'
      };
      showErr(map[e.code] || '登入失敗，請稍後再試');
    } finally { setLoad(false); }
  };

  /* Enter key */
  ['inp-name','inp-email'].forEach(id => {
    document.getElementById(id)?.addEventListener('keydown', e => { if(e.key==='Enter') document.getElementById('inp-pwd').focus(); });
  });
  document.getElementById('inp-pwd').addEventListener('keydown', e => { if(e.key==='Enter') window.handleLogin(); });

  /* Restore theme */
  ;(function(){
    const t = localStorage.getItem('vip_theme');
    if (t) { document.body.dataset.theme=t; document.querySelectorAll('.td').forEach(d=>d.classList.toggle('active',d.dataset.t===t)); }
  })();

  /* Init: default to staff tab so 宋維 can log in directly */
  switchRole('staff');
</script>

<script>
function setTheme(name, el) {
  document.body.dataset.theme = name;
  document.querySelectorAll('.td').forEach(d => d.classList.remove('active'));
  el.classList.add('active');
  localStorage.setItem('vip_theme', name);
}
</script>
</body>
</html>
