<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>家長專屬平台 · 互動美語 X 如苑</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Noto+Serif+TC:wght@400;600&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{--gold:#C9A84C;--gold-light:#E8C97A;--gold-dim:#8A6E30;--black:#0D0D0D;--surface:#161616;--surface2:#1F1F1F;--border:rgba(201,168,76,.25);--text-main:#F0EAD6;--text-muted:#9A9180;--radius:12px;--font-serif:'Playfair Display','Noto Serif TC',serif}
    [data-theme="ivory"]{--black:#F6F0E4;--surface:#FFFDF8;--surface2:#F1E6D2;--border:rgba(138,110,48,.28);--text-main:#241D14;--text-muted:#756A5A;--gold:#9C7A24;--gold-light:#B99335;--gold-dim:#7B642A}
    [data-theme="studio"]{--black:#07121C;--surface:#102033;--surface2:#162B42;--border:rgba(103,177,255,.26);--text-main:#EAF4FF;--text-muted:#91A7BD;--gold:#67B1FF;--gold-light:#A6D4FF;--gold-dim:#6D91B6}
    body{min-height:100vh;background:var(--black);color:var(--text-main);font-family:-apple-system,'Noto Sans TC',sans-serif}
    header{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--border);padding:18px 22px;display:flex;justify-content:space-between;gap:14px;align-items:center;flex-wrap:wrap}
    .title{font-family:var(--font-serif);font-size:21px;color:var(--gold-light)}
    .sub{font-size:13px;color:var(--text-muted);margin-top:4px}
    .actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    button{font-family:inherit;cursor:pointer}
    .pill-btn{background:transparent;border:1px solid var(--border);border-radius:999px;color:var(--text-muted);padding:7px 11px;font-size:12px}
    .pill-btn.active,.logout{background:var(--gold);color:var(--black);border-color:var(--gold)}
    .logout{border-radius:8px;padding:9px 14px;font-weight:600}
    main{max-width:1100px;margin:0 auto;padding:24px;display:grid;grid-template-columns:1.1fr .9fr;gap:18px}
    .panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px}
    .panel.wide{grid-column:1 / -1}
    h2{font-family:var(--font-serif);font-size:18px;color:var(--gold);margin-bottom:14px}
    .empty{color:var(--text-muted);font-size:14px;line-height:1.7;padding:14px 0}
    .item{border:1px solid rgba(201,168,76,.14);background:var(--surface2);border-radius:10px;padding:14px;margin-bottom:10px}
    .item-title{font-weight:700;color:var(--gold-light);margin-bottom:6px}
    .meta{font-size:12px;color:var(--text-muted);margin-bottom:6px}
    .body{font-size:14px;line-height:1.7;white-space:pre-wrap}
    .schedule-img{width:100%;border-radius:10px;border:1px solid var(--border);margin-top:10px;background:var(--surface2)}
    .tag{display:inline-block;border:1px solid var(--border);border-radius:999px;padding:3px 8px;font-size:12px;color:var(--gold-light);margin:4px 4px 0 0}
    @media(max-width:800px){main{grid-template-columns:1fr;padding:14px}header{padding:14px}.panel.wide{grid-column:auto}}
  </style>
</head>
<body>
  <header>
    <div>
      <div class="title">家長專屬平台</div>
      <div class="sub"><span id="studentName">載入中</span> · <span id="className">班級確認中</span></div>
    </div>
    <div class="actions">
      <button class="pill-btn" data-theme-btn="obsidian" onclick="setTheme('obsidian')">曜石金</button>
      <button class="pill-btn" data-theme-btn="ivory" onclick="setTheme('ivory')">白瓷紙</button>
      <button class="pill-btn" data-theme-btn="studio" onclick="setTheme('studio')">藍調學院</button>
      <button class="logout" onclick="logout()">登出</button>
    </div>
  </header>

  <main>
    <section class="panel">
      <h2>班級課表</h2>
      <div id="scheduleArea"><div class="empty">課表載入中...</div></div>
    </section>

    <section class="panel">
      <h2>最新訊息</h2>
      <div id="messageList"><div class="empty">訊息載入中...</div></div>
    </section>

    <section class="panel wide">
      <h2>聯絡簿</h2>
      <div id="contactList"><div class="empty">聯絡簿載入中...</div></div>
    </section>

    <section class="panel wide">
      <h2>成績與診斷</h2>
      <div id="gradeList"><div class="empty">成績載入中...</div></div>
    </section>
  </main>

  <script type="module">
    import { db, auth } from '../js/firebase-config.js';
    import { signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { collection, query, where, getDocs, getDoc, doc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const uid = sessionStorage.getItem('vip_uid');
    const role = sessionStorage.getItem('vip_role');
    const studentName = sessionStorage.getItem('vip_name') || '';
    let className = sessionStorage.getItem('vip_class') || '';
    if (!uid || role !== 'parent') window.location.href = '../index.html';

    function escapeHtml(value){return String(value||'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[ch]))}
    function dateText(v){try{return v?.toDate ? v.toDate().toLocaleString('zh-TW',{hour12:false}) : (v || '')}catch(e){return ''}}
    window.setTheme=function(theme){document.documentElement.dataset.theme=theme;localStorage.setItem('vip_theme',theme);document.querySelectorAll('[data-theme-btn]').forEach(btn=>btn.classList.toggle('active',btn.dataset.themeBtn===theme))}
    setTheme(localStorage.getItem('vip_theme') || 'obsidian');
    window.logout=async function(){await signOut(auth);sessionStorage.clear();window.location.href='../index.html'}

    async function ensureProfile(){
      document.getElementById('studentName').textContent = studentName || '家長';
      if (!className) {
        const snap = await getDoc(doc(db,'users',uid));
        className = snap.data()?.className || '';
        sessionStorage.setItem('vip_class', className);
      }
      document.getElementById('className').textContent = className || '未指定班級';
    }

    async function loadSchedule(){
      const box=document.getElementById('scheduleArea');
      if(!className){box.innerHTML='<div class="empty">尚未設定班級，請聯繫老師。</div>';return}
      const snap=await getDoc(doc(db,'class_schedules',className));
      if(!snap.exists()){box.innerHTML='<div class="empty">老師尚未貼上本班課表。</div>';return}
      const d=snap.data();
      box.innerHTML=`${d.scheduleText?`<div class="body">${escapeHtml(d.scheduleText)}</div>`:''}${d.imageUrl?`<img class="schedule-img" src="${escapeHtml(d.imageUrl)}" alt="班級課表">`:''}<div class="meta">最後更新：${dateText(d.updatedAt)}</div>`;
    }

    async function loadMessages(){
      const box=document.getElementById('messageList');
      const snap=await getDocs(query(collection(db,'class_messages'),where('className','==',className)));
      const rows=[]; snap.forEach(s=>rows.push({id:s.id,...s.data()}));
      rows.sort((a,b)=>(dateText(b.createdAt)||'').localeCompare(dateText(a.createdAt)||''));
      box.innerHTML=rows.length?rows.slice(0,8).map(d=>`<div class="item"><div class="item-title">${escapeHtml(d.title)}</div><div class="meta">${dateText(d.createdAt)}</div><div class="body">${escapeHtml(d.body)}</div></div>`).join(''):'<div class="empty">目前沒有新訊息。</div>';
    }

    async function loadContacts(){
      const box=document.getElementById('contactList');
      const snap=await getDocs(query(collection(db,'contact_books'),where('className','==',className)));
      const rows=[]; snap.forEach(s=>{const d=s.data(); if(!d.studentId || d.studentId===uid) rows.push({id:s.id,...d});});
      rows.sort((a,b)=>(b.date||'').localeCompare(a.date||''));
      box.innerHTML=rows.length?rows.slice(0,12).map(d=>`<div class="item"><div class="item-title">${escapeHtml(d.date)} · ${escapeHtml(d.attendance||'')}</div><div class="body">英文：${escapeHtml(d.progressEnglish||'')}\n國文：${escapeHtml(d.progressChinese||'')}\n作業：${escapeHtml(d.homework||'')}</div><div>${(d.tags||[]).map(t=>`<span class="tag">${escapeHtml(t)}</span>`).join('')}</div></div>`).join(''):'<div class="empty">目前沒有聯絡簿內容。</div>';
    }

    async function loadGrades(){
      const box=document.getElementById('gradeList');
      const snap=await getDocs(query(collection(db,'grades'),where('studentId','==',uid)));
      const rows=[]; snap.forEach(s=>rows.push({id:s.id,...s.data()}));
      rows.sort((a,b)=>(dateText(b.examDate)||'').localeCompare(dateText(a.examDate)||''));
      box.innerHTML=rows.length?rows.map(d=>`<div class="item"><div class="item-title">${escapeHtml(d.title)} · ${Number(d.score)||0} 分</div><div class="meta">班平均：${Number(d.averageScore)||0} · ${dateText(d.examDate)}</div><div class="body">${escapeHtml(d.diagnosis||'')}</div></div>`).join(''):'<div class="empty">目前沒有成績資料。</div>';
    }

    await ensureProfile();
    await Promise.all([loadSchedule(),loadMessages(),loadContacts(),loadGrades()]);
  </script>
</body>
</html>
